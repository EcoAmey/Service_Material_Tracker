services:
  web:
    build: .
    image: service-tracker-web
    restart: unless-stopped
    environment:
      SECRET_KEY: ${SECRET_KEY}
      DEBUG: ${DEBUG}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      CLAPPIA_DB_HOST: ${CLAPPIA_DB_HOST}
      CLAPPIA_DB_PORT: ${CLAPPIA_DB_PORT}
      CLAPPIA_DB_NAME: ${CLAPPIA_DB_NAME}
      CLAPPIA_DB_USER: ${CLAPPIA_DB_USER}
      CLAPPIA_DB_PASSWORD: ${CLAPPIA_DB_PASSWORD}
    ports:
      - "8000:8000"
